<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EQ Raid Gear Comparison</title>
  <link rel="stylesheet" href="css/site.css" />
  <script src="vendor/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>EQ Raid Gear Comparison</h1>
    <nav>
      <a class="active" href="index.html">Armor / BiS</a>
      <a href="weapons.html">T2 Weapons</a>
    </nav>
  </header>
  <main>
    <div class="controls">
      <label>Class
        <select id="classSelect"></select>
      </label>
      <label>Expansion A
        <select id="expA"></select>
      </label>
      <label>Expansion B
        <select id="expB"></select>
      </label>
      <label>Mode
        <select id="modeSelect">
          <option value="T1">T1</option>
          <option value="T2">T2</option>
          <option value="BIS">BIS</option>
        </select>
      </label>
    </div>

    <div id="banner" class="banner hidden"></div>
    <div class="compare-row">
      <section class="panel panel-chart">
        <h2>Stat change (older → newer)</h2>
        <div class="chart-wrap">
          <canvas id="pctChart"></canvas>
        </div>
      </section>

      <section class="panel panel-totals">
        <h2>Set totals</h2>
        <div class="totals-scroll">
          <table>
            <thead>
              <tr>
                <th>Stat</th>
                <th class="num" id="baseCol">Base</th>
                <th class="num" id="otherCol">Other</th>
                <th class="num">Change</th>
                <th class="num">%</th>
              </tr>
            </thead>
            <tbody id="totalsBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <section class="panel">
      <h2>Loadout by slot</h2>
      <div id="slotList" class="slot-grid"></div>
    </section>
  </main>
  <script type="module" src="js/armor.js"></script>
</body>
</html>
